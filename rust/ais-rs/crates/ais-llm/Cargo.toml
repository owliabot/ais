[package]
name = "ais-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# NOTE: We build `reqwest` with `default-features = false`, so we must explicitly
# enable response decompression. Some LLM gateways (openrouter/groq/etc.) return
# compressed responses by default.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate"] }
