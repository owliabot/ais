schema: "ais-pack/0.0.2"

meta:
  name: "uniswap-v3-sepolia"
  version: "0.0.1"
  description: "Uniswap V3 swap pack for Sepolia testnet with conservative defaults"

includes:
  - protocol: "uniswap-v3"
    version: "0.0.2"
    source: "local"
    chain_scope: ["eip155:11155111"]

policy:
  approvals:
    auto_execute_max_risk_level: 2
    require_approval_min_risk_level: 3

  hard_constraints_defaults:
    max_slippage_bps: 100               # 1% default — Sepolia can be thin
    allow_unlimited_approval: false
    max_approval_multiplier: 1.05

token_policy:
  resolution:
    allow_symbol_input: true
    require_user_confirm_asset_address: false
    require_allowlist_for_symbol_resolution: true

  allowlist:
    - chain: "eip155:11155111"
      symbol: "WETH"
      address: "0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14"
      decimals: 18
      tags: ["wrapped"]

    - chain: "eip155:11155111"
      symbol: "USDC"
      address: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
      decimals: 6
      tags: ["stable"]

plugins:
  execution:
    enabled:
      - type: "evm_rpc"
        chains: ["eip155:11155111"]
      - type: "evm_read"
        chains: ["eip155:11155111"]
      - type: "evm_call"
        chains: ["eip155:11155111"]

providers:
  detect:
    enabled:
      - kind: "best_quote"
        provider: "uniswap-v3-fee-detect"
        chains: ["eip155:11155111"]
        candidates: [100, 500, 3000, 10000]
        rule: "max_liquidity"
        priority: 10

overrides:
  actions:
    "uniswap-v3.swap-exact-in":
      hard_constraints:
        max_slippage_bps: 100

extensions: {}
