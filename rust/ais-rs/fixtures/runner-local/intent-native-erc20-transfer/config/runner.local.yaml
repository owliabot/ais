schema: "ais-runner/0.0.1"

llm:
  provider: openrouter
  model: qwen/qwen3.5-122b-a10b
  api_key: ${OPENROUTER_API_KEY}
  api_base: https://openrouter.ai/api/v1
  controller_prompts_dir: fixtures/runner-local/llm-prompts/prompts
  operator_templates_dir: fixtures/runner-local/llm-prompts/operator-templates
  context_limit_tokens: 262K


engine:
  max_concurrency: 4
  per_chain:
    "eip155:31338":
      max_read_concurrency: 4
      max_write_concurrency: 1

chains:
  "eip155:31338":
    rpc_url: "http://127.0.0.1:8545"
    wait_for_receipt: true
    receipt_poll:
      interval_ms: 1000
      max_attempts: 60
    signer:
      type: "evm_private_key"
      private_key: ${AIS_RUNNER_LOCAL_EVM_PRIVATE_KEY}

runtime:
  ctx:
    wallet_address: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
