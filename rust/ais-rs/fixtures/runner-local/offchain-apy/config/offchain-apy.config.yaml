schema: "ais-runner/0.0.1"

engine:
  max_concurrency: 4
  per_chain:
    "eip155:1": { max_read_concurrency: 4, max_write_concurrency: 1 }

chains:
  "eip155:1":
    rpc_url: "https://eth-mainnet.g.alchemy.com/v2/YOUR_KEY"
    timeout_ms: 12000

plugins:
  execution:
    offchain_apy_query:
      enabled: true
      chains: ["eip155:1"]
      allowed_domains:
        - "api.example.com"
        - "*.trusted-defi.example"
      timeout_ms: 5000
      max_retries: 2
      retry_backoff_ms: 250
