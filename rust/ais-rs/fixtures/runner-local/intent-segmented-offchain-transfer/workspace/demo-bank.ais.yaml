schema: "ais/0.0.2"

meta:
  protocol: "demo-bank"
  version: "0.0.1"
  name: "Demo Offchain Bank"
  description: "Local offchain balance/transfer protocol for segmented intent tests."
  tags: ["offchain", "fixture", "segmented"]

capabilities_required:
  - "offchain_apy_query"

deployments:
  - chain: "eip155:31338"
    contracts: {}

queries:
  native-balance:
    description: "Query native balance from offchain endpoint."
    params:
      - { name: endpoint, type: string, required: true, description: "HTTP endpoint" }
      - { name: owner, type: address, required: true, description: "Wallet address" }
    returns:
      - { name: balance, type: uint256, description: "Native balance" }
    execution:
      "eip155:*":
        type: offchain_apy_query
        method: GET
        endpoint: { ref: "params.endpoint" }

  token-balance:
    description: "Query token balance from offchain endpoint."
    params:
      - { name: endpoint, type: string, required: true, description: "HTTP endpoint" }
      - { name: owner, type: address, required: true, description: "Wallet address" }
      - { name: token, type: string, required: true, description: "Token symbol" }
    returns:
      - { name: balance, type: uint256, description: "Token balance" }
    execution:
      "eip155:*":
        type: offchain_apy_query
        method: GET
        endpoint: { ref: "params.endpoint" }

actions:
  native-transfer:
    description: "Submit transfer request via offchain endpoint."
    risk_level: 3
    risk_tags: ["transfer"]
    params:
      - { name: endpoint, type: string, required: true, description: "HTTP endpoint" }
      - { name: to, type: address, required: true, description: "Recipient" }
      - { name: amount, type: token_amount, required: true, description: "Native amount" }
    execution:
      "eip155:*":
        type: offchain_apy_query
        method: POST
        endpoint: { ref: "params.endpoint" }
        args:
          to: { ref: "params.to" }
          amount: { ref: "params.amount" }

extensions: {}
