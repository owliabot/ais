[workspace]
members = [
  "crates/ais-agent-control",
  "crates/ais-agent-core",
  "crates/ais-agent-runtime",
  "crates/ais-agent-store-sqlite",
  "crates/ais-agent-expr",
  "crates/ais-agent-chain-shared",
  "crates/ais-agent-evm",
  "crates/ais-agent-solana",
  "crates/ais-agent-drivers",
  "crates/ais-agent-host",
  "crates/ais-agent-transport",
  "crates/ais-agent-observability-files",
  "crates/ais-agent-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
bincode = { version = "2", features = ["serde"] }
num-bigint = "0.4"
num-traits = "0.2"
bigdecimal = "0.4"
alloy = { version = "1.1.0", features = ["full", "node-bindings"] }
alloy-primitives = "1"
solana-client = "3"
solana-sdk = "3"
rusqlite = { version = "0.34", features = ["bundled"] }
tracing = "0.1"
