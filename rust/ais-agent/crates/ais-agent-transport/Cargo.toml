[package]
name = "ais-agent-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ais-agent-control = { path = "../ais-agent-control" }
ais-agent-host = { path = "../ais-agent-host" }
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
ais-agent-core = { path = "../ais-agent-core" }
ais-agent-runtime = { path = "../ais-agent-runtime" }
ais-agent-store-sqlite = { path = "../ais-agent-store-sqlite" }
