[package]
name = "ais-agent-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ais-agent-host = { path = "../ais-agent-host" }
ais-agent-observability-files = { path = "../ais-agent-observability-files" }
ais-agent-runtime = { path = "../ais-agent-runtime" }
ais-agent-store-sqlite = { path = "../ais-agent-store-sqlite" }
ais-agent-transport = { path = "../ais-agent-transport" }
clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
ais-agent-control = { path = "../ais-agent-control" }

[[bin]]
name = "ais-agent"
path = "src/main.rs"
