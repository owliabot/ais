schema: "ais-runner/0.0.1"

# Runner config template — Uniswap V3 LP (mainnet)
#
# SIGNER NOTE:
# Current ais-runner supports `evm_private_key` only.
# Clawlet (type: "clawlet") requires implementing ClawletSigner in ais-evm-executor.
# See references/openclaw-bot.md for the planned integration design.

chains:
  "eip155:1":
    rpc_url: "https://mainnet.infura.io/v3/YOUR_KEY"   # or Alchemy
    timeout_ms: 30000
    wait_for_receipt: true
    receipt_poll:
      interval_ms: 5000
      max_attempts: 20
    signer:
      type: evm_private_key
      private_key: "0xYOUR_PRIVATE_KEY"   # load from env in production

# llm:
#   provider: "openai"
#   model: "gpt-4o"
#   api_key: "sk-..."

runtime:
  ctx:
    wallet_address: "0xYOUR_WALLET_ADDRESS"
