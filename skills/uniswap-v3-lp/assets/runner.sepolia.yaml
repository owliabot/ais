# Runner config — Uniswap V3 LP on Sepolia (eip155:11155111)
# 1. Fill in rpc_url, clawlet endpoint/account, wallet_address
# 2. Optionally uncomment llm block for agent mode
# 3. Run from repo root: see SKILL.md for commands

chains:
  "eip155:11155111":
    rpc_url: "https://rpc.sepolia.org"   # replace with Alchemy/Infura for reliability
    signer:
      # AIS assembles calldata; clawlet signs and broadcasts the transaction.
      type: "clawlet"
      endpoint: "http://localhost:7777"   # clawlet daemon address
      account: "sepolia-test"             # clawlet account label

# Uncomment for agent (natural-language intent) mode:
# llm:
#   provider: "openai"
#   model: "gpt-4o"
#   api_key: "sk-..."

runtime:
  ctx:
    wallet_address: "0xYOUR_WALLET_ADDRESS"  # must match clawlet account

