schema: "ais-runner/0.0.1"

# Runner config — Uniswap V3 LP on Sepolia (eip155:11155111)
#
# SIGNER NOTE:
# The current ais-runner only supports `evm_private_key` as the EVM signer type.
# Clawlet integration (type: "clawlet") requires implementing the EvmTransactionSigner
# trait in ais-evm-executor and adding a ClawletSigner variant to SignerConfig in
# ais-runner/src/config.rs. Until that is implemented, use evm_private_key below.
#
# For production/bot use, load private_key from an env var or secrets manager —
# never hard-code a real key here.

chains:
  "eip155:11155111":
    rpc_url: "https://rpc.sepolia.org"   # replace with Alchemy/Infura for reliability
    timeout_ms: 30000
    wait_for_receipt: true
    receipt_poll:
      interval_ms: 3000
      max_attempts: 20
    signer:
      type: evm_private_key
      private_key: "0xYOUR_SEPOLIA_PRIVATE_KEY"   # Sepolia ONLY — never use a mainnet key

# Uncomment for agent (natural-language intent) mode:
# llm:
#   provider: "openai"
#   model: "gpt-4o"
#   api_key: "sk-..."

runtime:
  ctx:
    wallet_address: "0xYOUR_WALLET_ADDRESS"   # must match private_key above

# Sepolia contract addresses (already in protocol — for reference only):
#   Factory:          0x0227628f3F023bb0B980b67D528571c95c6DaC1c
#   PositionManager:  0x1238536071E1c677A632429e3655c799b22cDA52
#   WETH:             0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14
#   USDC (test):      0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238
