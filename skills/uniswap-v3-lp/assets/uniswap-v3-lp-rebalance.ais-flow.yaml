schema: "ais-flow/0.0.3"

meta:
  name: "uniswap-v3-lp-rebalance"
  version: "0.0.1"
  description: >
    Rebalance a Uniswap V3 LP position when price moves out of range.
    Queries current position and pool tick. If out-of-range: removes all
    liquidity, collects fees+tokens, then mints a new position centered on
    the current tick. Workflow asserts that the position IS out-of-range
    before taking action — call this only when rebalancing is needed, or
    wrap in a bot loop that checks outputs.current_tick vs range first.

requires_pack:
  name: "uniswap-v3-lp"
  version: "0.0.1"

# inputs is a map: name → {type, required, default, description}
inputs:
  token_id:
    type: string
    required: true
    description: "NFT token ID of the existing LP position to rebalance"
  range_width_ticks:
    type: string
    required: false
    default: "600"
    description: >
      Half-width of the new range in ticks (e.g. 600 = ±600 ticks from current tick).
      Must align to fee tier tick spacing (500→10, 3000→60, 10000→200).
  slippage_bps:
    type: string
    required: false
    default: "50"
    description: "Slippage tolerance in bps for the new mint"

policy:
  approvals:
    auto_execute_max_risk_level: 1      # collect-fees auto-executes
    require_approval_min_risk_level: 3  # decrease + mint require user approval

default_chain: "eip155:11155111"

nodes:
  # ── Step 1: fetch current position data ──────────────────────────────────
  - id: q_position
    type: query_ref
    protocol: uniswap-v3-lp@0.0.1
    query: position-info
    args:
      token_id: { ref: "inputs.token_id" }
    # Guard: position must have liquidity > 0
    assert:
      cel: "nodes.q_position.outputs.liquidity > 0"
    assert_message: "Position has zero liquidity — nothing to rebalance"

  # ── Step 2: fetch pool address ────────────────────────────────────────────
  - id: q_pool
    type: query_ref
    protocol: uniswap-v3-lp@0.0.1
    query: get-pool
    deps: [q_position]
    args:
      token0: { ref: "nodes.q_position.outputs.token0" }
      token1: { ref: "nodes.q_position.outputs.token1" }
      fee: { ref: "nodes.q_position.outputs.fee" }
    # Guard: pool must exist (non-zero address)
    assert:
      cel: "nodes.q_pool.outputs.pool != \"0x0000000000000000000000000000000000000000\""
    assert_message: "Pool does not exist for this token pair and fee tier"

  # ── Step 3: fetch current pool tick ──────────────────────────────────────
  - id: q_slot0
    type: query_ref
    protocol: uniswap-v3-lp@0.0.1
    query: pool-slot0
    deps: [q_pool]
    args:
      pool_address: { ref: "nodes.q_pool.outputs.pool" }
    # Guard: position must be out of range to justify rebalancing
    assert:
      cel: >
        nodes.q_slot0.outputs.tick < nodes.q_position.outputs.tickLower ||
        nodes.q_slot0.outputs.tick > nodes.q_position.outputs.tickUpper
    assert_message: "Position is still in range — no rebalancing needed"

  # ── Step 4: remove all liquidity ─────────────────────────────────────────
  # Slippage protection on unwind: use 1% floor to protect against sandwich.
  - id: a_decrease
    type: action_ref
    protocol: uniswap-v3-lp@0.0.1
    action: decrease-liquidity
    deps: [q_slot0]
    args:
      token_id: { ref: "inputs.token_id" }
      liquidity: { ref: "nodes.q_position.outputs.liquidity" }
      # amount0_min / amount1_min: 0 is acceptable here because the position is
      # entirely single-sided (out of range), so only one token will be returned.
      # The slippage risk is on the mint leg, not the decrease leg.
      amount0_min: { lit: "0" }
      amount1_min: { lit: "0" }

  # ── Step 5: collect freed tokens + fees ──────────────────────────────────
  - id: a_collect
    type: action_ref
    protocol: uniswap-v3-lp@0.0.1
    action: collect-fees
    deps: [a_decrease]
    args:
      token_id: { ref: "inputs.token_id" }

  # ── Step 6: re-query position to get tokensOwed after decrease ───────────
  # After decreaseLiquidity: tokensOwed0/1 = freed liquidity tokens + fees
  # These are exactly what collect will sweep, and what we re-mint with.
  - id: q_position_after
    type: query_ref
    protocol: uniswap-v3-lp@0.0.1
    query: position-info
    deps: [a_collect]
    args:
      token_id: { ref: "inputs.token_id" }

  # ── Step 7: fetch token allowances for new mint ───────────────────────────
  - id: q_allowance0
    type: query_ref
    protocol: uniswap-v3-lp@0.0.1
    query: raw-allowance
    deps: [q_position_after]
    args:
      token_address: { ref: "nodes.q_position.outputs.token0" }

  - id: q_allowance1
    type: query_ref
    protocol: uniswap-v3-lp@0.0.1
    query: raw-allowance
    deps: [q_position_after]
    args:
      token_address: { ref: "nodes.q_position.outputs.token1" }

  # ── Step 8: mint new position at tick-aligned range ───────────────────────
  # Tick spacing by fee tier: 100→1, 500→10, 3000→60, 10000→200
  # new_tick_lower = floor((current - width) / spacing) * spacing
  # new_tick_upper = ceil((current + width) / spacing) * spacing
  - id: a_mint
    type: action_ref
    protocol: uniswap-v3-lp@0.0.1
    action: mint-position-atomic
    deps: [q_allowance0, q_allowance1]
    # calculated_overrides compute tick_spacing, new_tick_lower, new_tick_upper
    # from the current tick and range_width_ticks input.
    args:
      token0_address: { ref: "nodes.q_position.outputs.token0" }
      token1_address: { ref: "nodes.q_position.outputs.token1" }
      fee: { ref: "nodes.q_position.outputs.fee" }
      # Tick range computed inline via CEL: floor/ceil to nearest tick_spacing boundary.
      # tick_spacing: fee 100→1, 500→10, 3000→60, 10000→200
      tick_lower:
        cel: >
          int(
            floor(
              double(nodes.q_slot0.outputs.tick - int(inputs.range_width_ticks)) /
              double(
                nodes.q_position.outputs.fee == 100 ? 1 :
                nodes.q_position.outputs.fee == 500 ? 10 :
                nodes.q_position.outputs.fee == 3000 ? 60 : 200
              )
            ) *
            double(
              nodes.q_position.outputs.fee == 100 ? 1 :
              nodes.q_position.outputs.fee == 500 ? 10 :
              nodes.q_position.outputs.fee == 3000 ? 60 : 200
            )
          )
      tick_upper:
        cel: >
          int(
            ceil(
              double(nodes.q_slot0.outputs.tick + int(inputs.range_width_ticks)) /
              double(
                nodes.q_position.outputs.fee == 100 ? 1 :
                nodes.q_position.outputs.fee == 500 ? 10 :
                nodes.q_position.outputs.fee == 3000 ? 60 : 200
              )
            ) *
            double(
              nodes.q_position.outputs.fee == 100 ? 1 :
              nodes.q_position.outputs.fee == 500 ? 10 :
              nodes.q_position.outputs.fee == 3000 ? 60 : 200
            )
          )
      # Collected amounts are already atomic — no to_atomic conversion applied
      # tokensOwed after decreaseLiquidity = freed liquidity + accumulated fees = total to re-mint
      amount0_atomic: { ref: "nodes.q_position_after.outputs.tokensOwed0" }
      amount1_atomic: { ref: "nodes.q_position_after.outputs.tokensOwed1" }
      slippage_bps: { ref: "inputs.slippage_bps" }
      token0_allowance: { ref: "nodes.q_allowance0.outputs.allowance_atomic" }
      token1_allowance: { ref: "nodes.q_allowance1.outputs.allowance_atomic" }

outputs:
  new_token_id:
    cel: "nodes.a_mint.outputs.tokenId"
  current_tick:
    cel: "nodes.q_slot0.outputs.tick"
  old_tick_lower:
    cel: "nodes.q_position.outputs.tickLower"
  old_tick_upper:
    cel: "nodes.q_position.outputs.tickUpper"
  collected_amount0:
    cel: "nodes.q_position.outputs.tokensOwed0"
  collected_amount1:
    cel: "nodes.q_position.outputs.tokensOwed1"
