  version: "0.0.2"
  name: "Uniswap V3"
  homepage: "https://uniswap.org"
  description: "Swap via Uniswap V3 router with quote-based minOut"
  tags: ["dex", "swap", "liquidity", "amm"]
  maintainer: "uniswap.eth"

