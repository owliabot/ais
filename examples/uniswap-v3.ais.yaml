      - chain: "eip155:8453"
        address: "0x4200000000000000000000000000000000000006"
        decimals: 18
      - chain: "eip155:42161"
        address: "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
        decimals: 18
    tags: ["wrapped"]

  - symbol: "USDC"
    name: "USD Coin"
    deployments:
      - chain: "eip155:1"
        address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
