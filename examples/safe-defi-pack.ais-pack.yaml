schema: "ais-pack/0.0.2"

name: "safe-defi-pack"
version: "0.0.2"
description: "Enable Uniswap V3 swap with conservative defaults"

includes:
  - protocol: "uniswap-v3"
    version: "0.0.2"
    source: "registry"
    chain_scope: ["eip155:8453"]

policy:
  approvals:
    auto_execute_max_risk_level: 2
    require_approval_min_risk_level: 3
  execution:
    volatile_facts:
      max_age_ms: 30000

  constraints:
    - id: "global-max-slippage"
      effect: "hard_block"
      assert: "inputs.slippage_bps <= 50"
      message: "slippage exceeds global policy limit"

token_policy:
  resolution:
    allow_symbol_input: true
    require_user_confirm_asset_address: true
    require_allowlist_for_symbol_resolution: true

  allowlist:
    - chain: "eip155:8453"
      symbol: "WETH"
      address: "0x4200000000000000000000000000000000000006"
      decimals: 18
      tags: ["wrapped"]

    - chain: "eip155:8453"
      symbol: "USDC"
      address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      decimals: 6
      tags: ["stable"]

    - chain: "eip155:8453"
      symbol: "USDT"
      address: "0xfde4C96c8593536E31F229EA8f37b2ADa2699bb2"
      decimals: 6
      tags: ["stable"]

overrides:
  action_rules:
    - actions:
        - "uniswap-v3.swap-exact-in"
        - "uniswap-v3.swap-exact-out"
      constraints:
        - id: "swap-max-slippage"
          effect: "hard_block"
          assert: "params.slippage_bps <= 30"
          message: "slippage exceeds swap policy limit"
  actions:
    "uniswap-v3.swap-exact-in":
      constraints:
        - id: "exact-in-tight-slippage"
          effect: "hard_block"
          assert: "params.slippage_bps <= 20"
          message: "slippage exceeds exact-in policy limit"
